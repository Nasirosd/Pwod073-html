<!DOCTYPE html>
<html lang="en">
<head>
<title>Dashboard - Bangali Hotel</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>


<div class="container-fluid">
  <div class="row min-vh-100">
    <aside class="col-md-2 bg-dark text-white p-4">
      <h4>Hotel Admin</h4><hr>
      <a href="dashboard.html" class="d-block text-white text-decoration-none mb-3">Dashboard</a>
      <a href="rooms.html" class="d-block text-white text-decoration-none mb-3">Rooms</a>
      <a href="booking.html" class="d-block text-white text-decoration-none mb-3">Bookings</a>
      <a href="index.html" class="d-block text-white text-decoration-none mb-3">Website</a>
      <a href="login.html" class="d-block text-warning text-decoration-none">Logout</a>
    </aside>
    <main class="col-md-10 p-4">
      <h1 class="mb-4">Dashboard</h1>
      <div class="row g-4">
        <div class="col-md-3"><div class="card dashboard-card p-4"><h6>Total Rooms</h6><h2>48</h2></div></div>
        <div class="col-md-3"><div class="card dashboard-card p-4"><h6>Available</h6><h2>19</h2></div></div>
        <div class="col-md-3"><div class="card dashboard-card p-4"><h6>Booked</h6><h2>29</h2></div></div>
        <div class="col-md-3"><div class="card dashboard-card p-4"><h6>Guests</h6><h2>37</h2></div></div>
      </div>
      <div class="card dashboard-card mt-4">
        <div class="card-body">
          <h4>Recent Bookings</h4>
          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead><tr><th>#</th><th>Guest</th><th>Room</th><th>Check In</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td>1001</td><td>Rahim Ahmed</td><td>Deluxe</td><td>10 Sep 2026</td><td><span class="badge bg-success">Confirmed</span></td></tr>
                <tr><td>1002</td><td>Karim Hasan</td><td>Standard</td><td>11 Sep 2026</td><td><span class="badge bg-warning text-dark">Pending</span></td></tr>
                <tr><td>1003</td><td>Nusrat Jahan</td><td>Family Suite</td><td>12 Sep 2026</td><td><span class="badge bg-success">Confirmed</span></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
