<!DOCTYPE html>
<html lang="en">
<head>
<title>Booking - RoyalStay Hotel</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Bangali Hotel</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="rooms.html">Rooms</a></li>
        <li class="nav-item"><a class="nav-link" href="booking.html">Booking</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>


<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm p-4">
        <h1 class="section-title text-center">Book a Room</h1>
        <form id="bookingForm">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input type="tel" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Room Type</label>
              <select class="form-select" required>
                <option value="">Choose...</option><option>Standard Room</option><option>Deluxe Room</option>
                <option>Executive Room</option><option>Family Suite</option><option>Luxury Suite</option>
              </select>
            </div>
            <div class="col-md-6"><label class="form-label">Check In</label><input type="date" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Check Out</label><input type="date" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Adults</label><input type="number" min="1" value="1" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Children</label><input type="number" min="0" value="0" class="form-control"></div>
            <div class="col-12"><label class="form-label">Special Request</label><textarea class="form-control" rows="4"></textarea></div>
            <div class="col-12"><button class="btn btn-success w-100 btn-lg">Submit Booking</button></div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>


<footer class="footer mt-5 py-4">
  <div class="container text-center">
    <p class="mb-1">RoyalStay Hotel Management System</p>
    <small>&copy; <span class="current-year"></span> All Rights Reserved.</small>
  </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
